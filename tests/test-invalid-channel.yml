name: Test invalid channel input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-level: '29'
          arch: 'x86_64'
          channel: 'nightly'
          script: 'echo hello'
      - name: Assert action failed with invalid channel error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid channel, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid channel"
