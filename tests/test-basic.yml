name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4
      - name: Run Android Emulator Runner with minimal required inputs
        id: emulator
        uses: .
        with:
          api-level: 29
          script: echo "Emulator is running"
        continue-on-error: true

      - name: Assert action was invoked
        run: |
          echo "Emulator step outcome: ${{ steps.emulator.outcome }}"
          # The action may fail in act due to missing KVM/hardware acceleration,
          # but it should at least attempt to run (not be skipped).
          if [ "${{ steps.emulator.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.emulator.outcome }})"
